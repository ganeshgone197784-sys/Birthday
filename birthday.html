<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A surprise for you</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#07020a;--wine:#4a0d1f;--red:#a3122f;--plum:#2a0b3a;--glow:#ff5a7a;--tx:#fff5f6;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Jost',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow-x:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,var(--plum),transparent 60%),radial-gradient(100% 70% at 50% 110%,var(--wine),transparent 65%),var(--bg)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.scene{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));text-align:center;
opacity:0;visibility:hidden;transition:opacity 1.2s,visibility 1.2s,filter 1.2s;filter:blur(12px);overflow-y:auto}
.scene.on{opacity:1;visibility:visible;filter:none}
h1,h2,.big{font-family:var(--serif);font-weight:400;line-height:1.1}
h1{font-size:clamp(2.4rem,10vw,5rem)}h2{font-size:clamp(1.8rem,7vw,3rem)}
p,.line{font-family:var(--serif);font-size:clamp(1.25rem,5vw,1.8rem);line-height:1.5;max-width:30rem}
.line{opacity:0;filter:blur(10px);transform:translateY(8px);transition:all 1.4s;margin:.5em 0}
.line.in{opacity:1;filter:none;transform:none}
.sub{font-family:var(--sans);font-weight:300;opacity:.7;font-size:1rem;margin-top:.6rem}
.btn{margin-top:2rem;min-height:54px;padding:0 2rem;border-radius:99px;border:1px solid rgba(255,140,160,.5);
background:rgba(255,255,255,.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);
font:400 1rem var(--sans);letter-spacing:.12em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1.2s,box-shadow .3s}
.btn.in{opacity:1;pointer-events:auto;animation:pulse 2.4s infinite}
.btn:active{transform:scale(.97)}
@keyframes pulse{50%{box-shadow:0 0 28px rgba(255,90,122,.55)}}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px}
/* quiz */
#qbox{width:100%;max-width:30rem;padding:26px 20px}
#qbox h2{font-size:clamp(1.5rem,6vw,2.2rem);margin-bottom:1.2rem}
.opt{display:block;width:100%;min-height:52px;margin:10px 0;border-radius:14px;border:1px solid rgba(255,255,255,.18);
background:rgba(255,255,255,.05);color:var(--tx);font:400 1.05rem var(--sans);padding:12px;cursor:pointer;transition:background .3s}
.opt.ok{background:rgba(255,90,122,.35);border-color:var(--glow)}.opt.no{opacity:.4}
#fb{min-height:2.2em;margin-top:.6rem;font-family:var(--serif);font-size:1.3rem;color:#ffb3c1}
.dots{font-size:.85rem;opacity:.6;margin-bottom:1rem}
/* love */
#lovebig{font-family:var(--serif);font-size:clamp(3rem,16vw,8rem);opacity:0;letter-spacing:.04em;text-shadow:0 0 40px var(--glow),0 0 90px var(--red)}
#lovebig.in{animation:beat 1.3s infinite,zoom 14s linear forwards;opacity:1}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.08)}28%{transform:scale(1)}42%{transform:scale(1.05)}}
@keyframes zoom{from{filter:blur(14px)}to{filter:blur(0)}}
.burst{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle,rgba(255,90,122,.55),transparent 60%);opacity:0}
.burst.go{animation:burst 2.5s}@keyframes burst{30%{opacity:1}100%{opacity:.25}}
/* moments */
#s4{justify-content:flex-start;padding-top:12vh;padding-bottom:20vh}
.mom{width:100%;max-width:26rem;margin:16vh 0;opacity:0;transition:all 1.6s cubic-bezier(.2,.7,.2,1)}
.mom.a1{transform:translateY(60px)}.mom.a2{transform:translateX(-60px) rotate(-3deg)}
.mom.a3{transform:scale(.85);filter:blur(14px)}.mom.a4{transform:scale(1.25);filter:blur(22px)}
.mom.seen{opacity:1;transform:none;filter:none}
.tag{font-family:var(--serif);font-style:italic;font-size:1.1rem;color:#ffb3c1;margin-bottom:.8rem}
.frame{position:relative;padding:10px;border-radius:20px;background:linear-gradient(135deg,rgba(255,140,160,.5),rgba(120,40,160,.4));
box-shadow:0 0 50px rgba(255,90,122,.3);cursor:zoom-in}
.mom.a4 .frame{box-shadow:0 0 90px rgba(255,90,122,.65);animation:pulse 3s infinite}
.frame img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:12px;background:#1a0a1f;transition:transform 8s}
.mom.seen .frame img{transform:scale(1.06)}
.cap{font-family:var(--serif);font-size:1.3rem;line-height:1.4;margin-top:1rem}
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
#lb.on{display:flex}#lb img{max-width:100%;max-height:90vh;border-radius:12px}
/* party */
#cake{width:150px;margin:1rem auto}
.bal{position:fixed;bottom:-120px;width:46px;height:58px;border-radius:50% 50% 48% 48%;opacity:.85;animation:rise linear forwards;z-index:1}
@keyframes rise{to{transform:translateY(-120vh)}}
.love2{font-family:var(--serif);font-size:clamp(2.5rem,13vw,6rem);text-shadow:0 0 40px var(--glow);margin-top:1.2rem}
.heart{font-size:2rem;color:var(--glow);animation:beat 1.3s infinite;margin-top:1rem}
#secret{position:fixed;inset:0;z-index:30;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#secret.on{display:flex}
/* music */
#music{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:25;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;
border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--tx);font:300 .8rem var(--sans);cursor:pointer;min-height:40px}
.eq{display:flex;gap:2px;align-items:flex-end;height:14px}.eq i{width:3px;height:4px;background:var(--glow);border-radius:2px}
.playing .eq i{animation:eq .8s infinite alternate}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{to{height:14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="burst" id="burst"></div>

<!-- MUSIC: put your legal audio file next to this HTML and name it music.mp3 -->
<button id="music" aria-label="Play or pause music"><span class="eq"><i></i><i></i><i></i></span><span>♪ music</span></button>
<audio id="aud" src="music.mp3" loop preload="none"></audio>

<section class="scene on" id="s0"><div id="intro"></div><button class="btn" id="b0">OPEN YOUR SURPRISE ❤️</button></section>

<section class="scene" id="s1"><div id="bday"></div><button class="btn" id="b1">BEGIN</button></section>

<section class="scene" id="s2"><div id="qbox" class="glass"><div class="dots" id="qd"></div><h2 id="qq"></h2><div id="qo"></div><div id="fb"></div></div></section>

<section class="scene" id="s2b"><div id="wait"></div><button class="btn" id="b2b">ONE MORE THING →</button></section>

<section class="scene" id="s3"><div id="msg"></div><div id="lovebig">I LOVE YOU ❤️</div><button class="btn" id="b3">SEE OUR MOMENTS →</button></section>

<section class="scene" id="s4">
<h2>A Few Moments...</h2><p class="sub">That became memories worth keeping forever.</p>

<section class="scene" id="s7"><div id="fin"></div><div class="love2" id="l2" style="opacity:0;transition:opacity 2s">I LOVE YOU ❤️</div><div class="heart">❤</div>

<script>
/* ============ EDIT EVERYTHING HERE ============ */
const C={
 his:"[HIS NAME]",
 her:"[HER NAME]",
 // Scene 3 message: one line per item, written from her. Fill in later.
 message:["[MESSAGE LINE 1 — what you love about him]","[MESSAGE LINE 2 — a memory you shared]","[MESSAGE LINE 3 — what he means to you]"],
 // Quiz: q = question, o = options, a = index of correct option (0 = first)
 quiz:[
  {q:"[QUESTION 1 — e.g. Who fell first?]",o:["[Option A]","[Option B]","[Option C]"],a:0},
  {q:"[QUESTION 2 — what she loves most about you]",o:["[Option A]","[Option B]","[Option C]"],a:0},
  {q:"[QUESTION 3 — which nickname she calls you]",o:["[Option A]","[Option B]","[Option C]"],a:0},
  {q:"[QUESTION 4 — which moment means the most to her]",o:["[Option A]","[Option B]","[Option C]"],a:0},
  {q:"[QUESTION 5 — what makes your relationship special]",o:["[Option A]","[Option B]","[Option C]"],a:0}
 ],
 captions:["[CAPTION FOR PHOTO 1]","[CAPTION FOR PHOTO 2]","[CAPTION FOR PHOTO 3]"],
 finalMsg:["[FINAL MESSAGE LINE 1]","[FINAL MESSAGE LINE 2]"],
 herLine:"[A last personal line from her]",
 secret:["[SECRET ROMANTIC MESSAGE — line 1]","[line 2]"]
};
/* ============ ENGINE ============ */
const $=id=>document.getElementById(id),wait=ms=>new Promise(r=>setTimeout(r,ms));
let cur=$('s0');
function go(id){cur.classList.remove('on');cur=$(id);cur.classList.add('on');cur.scrollTop=0}
async function seq(el,lines,gap=2300,cls='line'){el.innerHTML='';for(const t of lines){const d=document.createElement('div');d.className=cls;d.textContent=t;el.appendChild(d);await wait(60);d.classList.add('in');await wait(gap)}}
const show=b=>$(b).classList.add('in');
/* particles: floating hearts + confetti, capped for phones */
const cv=$('fx'),cx=cv.getContext('2d');let W,H,P=[],heartsOn=true;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}rs();addEventListener('resize',rs);
function heart(x,y,s,c){cx.fillStyle=c;cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x,y-s*.3,x-s,y-s*.3,x-s,y+s*.3);
cx.bezierCurveTo(x-s,y+s*.8,x,y+s*1.1,x,y+s*1.4);cx.bezierCurveTo(x,y+s*1.1,x+s,y+s*.8,x+s,y+s*.3);cx.bezierCurveTo(x+s,y-s*.3,x,y-s*.3,x,y+s*.3);cx.fill()}
function spawn(n,burst){for(let i=0;i<n&&P.length<70;i++)P.push(burst?{t:'c',x:W/2,y:H/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-3,s:4+Math.random()*5,c:`hsl(${[340,350,20,300][i%4]},85%,${60+Math.random()*20}%)`,l:160}
:{t:'h',x:Math.random()*W,y:H+20,vx:(Math.random()-.5)*.4,vy:-.5-Math.random()*.9,s:5+Math.random()*9,c:`rgba(255,${90+Math.random()*60|0},${120+Math.random()*60|0},${.25+Math.random()*.4})`,l:600})}
(function loop(){cx.clearRect(0,0,W,H);if(heartsOn&&Math.random()<.06)spawn(1);
P=P.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.l--;if(p.t=='c'){p.vy+=.25;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)}else heart(p.x,p.y,p.s,p.c);return p.l>0&&p.y>-40});
requestAnimationFrame(loop)})();
const hb=n=>{for(let i=0;i<n;i++)setTimeout(()=>{P.push({t:'h',x:W/2+(Math.random()-.5)*W*.6,y:H/2,vx:(Math.random()-.5)*2,vy:-1-Math.random()*2,s:8+Math.random()*10,c:'rgba(255,90,122,.8)',l:140})},i*40)};
/* music */
const aud=$('aud'),mb=$('music');
mb.onclick=()=>{if(aud.paused){aud.play().then(()=>mb.classList.add('playing')).catch(()=>{})}else{aud.pause();mb.classList.remove('playing')}};
/* Screen 1 */
(async()=>{await wait(800);await seq($('intro'),["Hey... 👀","Someone made something special for you...","Ready?"],2200,'line big');show('b0')})();
$('b0').onclick=async()=>{aud.play().then(()=>mb.classList.add('playing')).catch(()=>{});go('s1');
 const b=$('bday');b.innerHTML=`<h1 class="line">Happy Birthday,<br>${C.his} ❤️</h1>`;await wait(300);b.firstChild.classList.add('in');
 await wait(2800);const l=document.createElement('p');l.className='line';l.textContent="But this isn't just another birthday wish...";b.appendChild(l);await wait(50);l.classList.add('in');
 await wait(2800);const m=document.createElement('p');m.className='line';m.textContent="It's a little journey through your story.";b.appendChild(m);await wait(50);m.classList.add('in');await wait(1800);show('b1')};
/* Screen 3 quiz */
let qi=0;
$('b1').onclick=()=>{go('s2');ask()};
function ask(){const q=C.quiz[qi];$('qd').textContent=`${qi+1} / ${C.quiz.length}`;$('qq').textContent=q.q;$('fb').textContent='';
 const o=$('qo');o.innerHTML='';q.o.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>pick(b,i);o.appendChild(b)})}
async function pick(b,i){const q=C.quiz[qi];document.querySelectorAll('.opt').forEach(x=>x.disabled=true);
 if(i==q.a){b.classList.add('ok');$('fb').textContent="Okayyy... you actually know her ❤️";hb(18)}else{b.classList.add('no');$('fb').textContent="Hmm... nice try 😂"}
 await wait(1800);qi++;if(qi<C.quiz.length)ask();else endQuiz()}
async function endQuiz(){go('s2b');const w=$('wait');await seq(w,["WAIT...","YOU KNOW HER REALLY WELL ❤️"],1800,'line big');show('b2b')}
/* Screen 4 message */
$('b2b').onclick=async()=>{go('s3');const m=$('msg');
 await wait(1200);await seq(m,["There are some things that are easier to feel than to say...",...C.message,"But there's one thing she never wants you to forget..."],2800);
 await wait(1500);m.style.transition='opacity 1.5s';m.style.opacity=0;await wait(2200);m.style.display='none';
 document.body.style.background='#000';$('burst').classList.add('go');$('lovebig').classList.add('in');hb(40);await wait(5000);show('b3')};
/* Screen 5 moments */
$('b3').onclick=()=>{document.body.style.background='';go('s4');
 C.captions.forEach((t,i)=>$('c'+(i+1)).textContent=t);
 const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('seen');if(x.target.classList.contains('a4'))hb(30)}}),{threshold:.35});
 document.querySelectorAll('.mom').forEach(m=>io.observe(m))};
document.querySelectorAll('.frame').forEach(f=>f.onclick=()=>{const i=f.querySelector('img');$('lb').querySelector('img').src=i.src;$('lb').classList.add('on')});
$('lb').onclick=()=>$('lb').classList.remove('on');
/* Screen 6 build-up */
$('b4').onclick=async()=>{go('s5');heartsOn=false;await wait(1500);
 await seq($('build'),["Three moments...","Countless feelings...","And hopefully...","A lifetime of memories still waiting to happen. ❤️"],2800,'line big');await wait(1500);
 heartsOn=true;$('hb2').textContent='';party()};
/* Screen 7 party */
async function party(){go('s6');$('hb2').innerHTML=`HAPPY BIRTHDAY<br>${C.his} ❤️`;document.body.style.filter='brightness(1.25)';
 const cols=['#a3122f','#ff5a7a','#7a2aa8','#ffb3c1'];
 for(let i=0;i<10;i++)setTimeout(()=>{const b=document.createElement('div');b.className='bal';b.style.left=Math.random()*90+'%';b.style.background=cols[i%4];b.style.animationDuration=(8+Math.random()*5)+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),14000)},i*500);
 for(let i=0;i<5;i++)setTimeout(()=>spawn(30,true),i*900);await wait(7000);show('b6')}
$('b6').onclick=async()=>{document.body.style.filter='';go('s7');await wait(1200);
 await seq($('fin'),[...C.finalMsg,"Happy Birthday, "+C.his+". ❤️","Keep smiling. Keep being you.",C.herLine],2600);
 $('l2').style.opacity=1;hb(30);await wait(2500);show('b7')};
/* Secret */
$('b7').onclick=async()=>{$('secret').classList.add('on');const s=$('sec');
 await wait(800);await seq(s,["Okay... this is actually the last thing.",...C.secret,"Now go give her a hug. ❤️"],2800)};
</script>
